plugins { id 'net.minecraftforge.gradle' version '6.0.54' }

minecraft { mappings channel: 'official', version: '1.21.1'; reobf = false }

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://libraries.minecraft.net/' } }
        filter { includeGroup 'org.lwjgl' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.0'
    compileOnly(project(':fabric-loader-shim')) { transitive = false }
    compileOnly(project(':fabric-block-api-v1-bridge')) { transitive = false }
}

tasks.named('jar') { manifest { attributes('LICENSE': 'Apache-2.0') } }
