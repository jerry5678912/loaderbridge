plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

minecraft {
    mappings channel: 'official', version: '1.21.1'
    reobf = false
}

repositories {
    exclusiveContent {
        forRepository {
            maven { url = 'https://libraries.minecraft.net/' }
        }
        filter {
            includeGroup 'org.lwjgl'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.0'
    implementation project(':bridge-api')
}

tasks.named('jar') {
    manifest {
        attributes(
            'Automatic-Module-Name': 'dev.loaderbridge.fabric.api.base',
            'LICENSE': 'Apache-2.0',
            'Implementation-Title': 'LoaderBridge Fabric API Base Bridge',
            'Implementation-Version': '0.4.42+6573ed8c19-loaderbridge.2'
        )
    }
}
