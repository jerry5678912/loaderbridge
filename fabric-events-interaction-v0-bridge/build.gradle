plugins { id 'net.minecraftforge.gradle' version '6.0.54' }

minecraft { mappings channel: 'official', version: '1.21.1'; reobf = false }

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://libraries.minecraft.net/' } }
        filter { includeGroup 'org.lwjgl' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.0'
    implementation project(':bridge-api')
    implementation(project(':fabric-api-base-bridge')) { transitive = false }
    implementation(project(':fabric-networking-api-v1-bridge')) { transitive = false }
}

tasks.named('jar') {
    manifest {
        attributes('Automatic-Module-Name': 'dev.loaderbridge.fabric.events.interaction.v0',
                'LICENSE': 'Apache-2.0',
                'Implementation-Version': '0.7.14+ba9dae0619-loaderbridge.2',
                'MixinConfigs': 'loaderbridge.fabric-events-interaction-v0.mixins.json')
    }
}
