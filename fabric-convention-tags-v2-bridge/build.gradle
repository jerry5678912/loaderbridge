plugins { id 'net.minecraftforge.gradle' version '6.0.54' }

minecraft { mappings channel: 'official', version: '1.21.1'; reobf = false }

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://libraries.minecraft.net/' } }
        filter { includeGroup 'org.lwjgl' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.0'
    implementation project(':bridge-api')
}

tasks.named('jar') {
    manifest {
        attributes('Automatic-Module-Name': 'dev.loaderbridge.fabric.api.convention.tags.v2',
                'LICENSE': 'Apache-2.0',
                'Implementation-Title': 'LoaderBridge Fabric Convention Tags v2 Bridge',
                'Implementation-Version': '2.12.0+c3656daa19-loaderbridge.2',
                'MixinConfigs': 'loaderbridge.fabric-convention-tags-v2.mixins.json')
    }
}
