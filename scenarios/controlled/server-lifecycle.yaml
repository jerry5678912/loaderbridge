schemaVersion: 1
id: controlled_server_lifecycle
description: Proves server readiness, command handling, world save, clean reload, and shutdown.
side: server
mods:
  - loaderbridge_fixture_main
steps:
  - id: start
    action: start_instance
    timeout: PT2M
  - id: ready
    action: wait_for_log
    timeout: PT2M
    parameters:
      contains: "Done ("
  - id: fixture_entrypoint
    action: wait_for_log
    timeout: PT30S
    parameters:
      contains: LOADERBRIDGE_FIXTURE_MAIN_READY
  - id: fixture_custom_entrypoint
    action: wait_for_log
    timeout: PT30S
    parameters:
      contains: LOADERBRIDGE_FIXTURE_CUSTOM_ENTRYPOINT_READY
  - id: fixture_constructor_entrypoint
    action: wait_for_log
    timeout: PT30S
    parameters:
      contains: LOADERBRIDGE_FIXTURE_CONSTRUCTOR_ENTRYPOINT_READY
  - id: fixture_kotlin_adapter
    action: wait_for_log
    timeout: PT30S
    parameters:
      contains: LOADERBRIDGE_FIXTURE_KOTLIN_ADAPTER_READY
  - id: fixture_nested_containment
    action: wait_for_log
    timeout: PT30S
    parameters:
      contains: LOADERBRIDGE_FIXTURE_NESTED_CONTAINMENT_READY
  - id: fixture_nested_child
    action: wait_for_log
    timeout: PT30S
    parameters:
      contains: LOADERBRIDGE_FIXTURE_NESTED_CHILD_READY
  - id: fixture_official_mappings
    action: wait_for_log
    timeout: PT30S
    parameters:
      contains: LOADERBRIDGE_FIXTURE_OFFICIAL_MAPPINGS_READY
  - id: fixture_raw_game_version
    action: wait_for_log
    timeout: PT30S
    parameters:
      contains: LOADERBRIDGE_FIXTURE_RAW_GAME_VERSION=1.21.1
  - id: fixture_builtin_mods
    action: wait_for_log
    timeout: PT30S
    parameters:
      contains: LOADERBRIDGE_FIXTURE_BUILTIN_MODS_READY
  - id: fixture_loader_metadata
    action: wait_for_log
    timeout: PT30S
    parameters:
      contains: LOADERBRIDGE_FIXTURE_LOADER_METADATA_READY
  - id: fixture_builtin_roots
    action: wait_for_log
    timeout: PT30S
    parameters:
      contains: LOADERBRIDGE_FIXTURE_BUILTIN_ROOTS_READY
  - id: fixture_launch_arguments
    action: wait_for_log
    timeout: PT30S
    parameters:
      contains: LOADERBRIDGE_FIXTURE_LAUNCH_ARGUMENTS_READY
  - id: fixture_prelaunch_entrypoint
    action: wait_for_log
    timeout: PT30S
    parameters:
      contains: LOADERBRIDGE_FIXTURE_PRELAUNCH_READY
  - id: fixture_prelaunch_discovery
    action: wait_for_log
    timeout: PT30S
    parameters:
      contains: LOADERBRIDGE_FIXTURE_PRELAUNCH_DISCOVERY_READY
  - id: fixture_server_entrypoint
    action: wait_for_log
    timeout: PT30S
    parameters:
      contains: LOADERBRIDGE_FIXTURE_SERVER_READY
  - id: fixture_server_game_instance
    action: wait_for_log
    timeout: PT30S
    parameters:
      contains: LOADERBRIDGE_FIXTURE_SERVER_GAME_INSTANCE_READY
  - id: fixture_mixin
    action: wait_for_log
    timeout: PT30S
    parameters:
      contains: LOADERBRIDGE_FIXTURE_MIXIN_APPLIED
  - id: fixture_mixin_config_plugin
    action: wait_for_log
    timeout: PT30S
    parameters:
      contains: LOADERBRIDGE_FIXTURE_MIXIN_PLUGIN_LOADED
  - id: fixture_mixin_extras
    action: wait_for_log
    timeout: PT30S
    parameters:
      contains: LOADERBRIDGE_FIXTURE_MIXIN_EXTRAS_APPLIED
  - id: save
    action: save
    timeout: PT1M
    parameters:
      marker: All dimensions are saved
  - id: reload
    action: reload
    timeout: PT3M
    parameters:
      marker: "Done ("
  - id: shutdown
    action: shutdown
    timeout: PT1M
    parameters:
      marker: All dimensions are saved
