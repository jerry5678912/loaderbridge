schemaVersion: 1
id: controlled_server_lifecycle
description: Proves server readiness, command handling, world save, clean reload, and shutdown.
side: server
mods:
  - loaderbridge_fixture_main
steps:
  - id: start
    action: start_instance
    timeout: PT2M
  - id: ready
    action: wait_for_log
    timeout: PT2M
    parameters:
      contains: "Done ("
  - id: fixture_entrypoint
    action: wait_for_log
    timeout: PT30S
    parameters:
      contains: LOADERBRIDGE_FIXTURE_MAIN_READY
  - id: save
    action: save
    timeout: PT1M
    parameters:
      marker: All dimensions are saved
  - id: reload
    action: reload
    timeout: PT3M
    parameters:
      marker: "Done ("
  - id: shutdown
    action: shutdown
    timeout: PT1M
    parameters:
      marker: All dimensions are saved
