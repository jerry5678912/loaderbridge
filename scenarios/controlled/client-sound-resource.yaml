schemaVersion: 1
id: client_sound_resource
description: Verifies the controlled sound event and resource are loaded on the client.
side: client
mods: [loaderbridge_test_probe]
steps:
  - {id: start, action: start_instance, timeout: PT3M}
  - {id: sound, action: assert_resource, timeout: PT2M, parameters: {subject: "sound/loaderbridge:fixture", equals: "loaded"}}
  - {id: stop, action: shutdown, timeout: PT1M, parameters: {marker: "LOADERBRIDGE_CLIENT_STOPPED"}}
