schemaVersion: 1
id: client_config_screen
description: Verifies the controlled configuration screen opens and reports expected widgets.
side: client
mods: [loaderbridge_test_probe]
steps:
  - {id: start, action: start_instance, timeout: PT3M}
  - {id: config_screen, action: assert_screen, timeout: PT2M, parameters: {subject: "loaderbridge:config", equals: "widgets_ready"}}
  - {id: stop, action: shutdown, timeout: PT1M, parameters: {marker: "LOADERBRIDGE_CLIENT_STOPPED"}}
