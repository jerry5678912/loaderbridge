schemaVersion: 1
id: fabric_lifecycle_server
description: Proves Fabric server and world tick callbacks through ready, save, reload, and shutdown.
side: server
mods:
  - loaderbridge_fabric_lifecycle_fixture
steps:
  - id: start
    action: start_instance
    timeout: PT3M
  - id: lifecycle_ready
    action: wait_for_log
    timeout: PT3M
    parameters:
      contains: LOADERBRIDGE_FABRIC_LIFECYCLE_TICKS_READY
  - id: server_lifecycle_ready
    action: wait_for_log
    timeout: PT1M
    parameters:
      contains: LOADERBRIDGE_FABRIC_SERVER_LIFECYCLE_READY
  - id: worlds_loaded
    action: wait_for_log
    timeout: PT1M
    parameters:
      contains: LOADERBRIDGE_FABRIC_WORLDS_LOADED
  - id: tags_ready
    action: wait_for_log
    timeout: PT1M
    parameters:
      contains: LOADERBRIDGE_FABRIC_LIFECYCLE_TAGS_READY
  - id: summon_entity
    action: send_command
    timeout: PT1M
    parameters:
      command: 'execute in minecraft:overworld positioned 0 100 0 run summon minecraft:armor_stand ~ ~ ~ {Tags:["loaderbridge_entity_fixture"]}'
  - id: entity_loaded
    action: wait_for_log
    timeout: PT1M
    parameters:
      contains: LOADERBRIDGE_FABRIC_ENTITY_LOADED
  - id: change_equipment
    action: send_command
    timeout: PT1M
    parameters:
      command: item replace entity @e[type=minecraft:armor_stand,tag=loaderbridge_entity_fixture,limit=1] armor.head with minecraft:diamond_helmet
  - id: equipment_changed
    action: wait_for_log
    timeout: PT1M
    parameters:
      contains: LOADERBRIDGE_FABRIC_EQUIPMENT_CHANGED
  - id: remove_entity
    action: send_command
    timeout: PT1M
    parameters:
      command: kill @e[type=minecraft:armor_stand,tag=loaderbridge_entity_fixture]
  - id: entity_unloaded
    action: wait_for_log
    timeout: PT1M
    parameters:
      contains: LOADERBRIDGE_FABRIC_ENTITY_UNLOADED
  - id: place_block_entity
    action: send_command
    timeout: PT1M
    parameters:
      command: setblock 0 100 0 minecraft:chest
  - id: block_entity_loaded
    action: wait_for_log
    timeout: PT1M
    parameters:
      contains: LOADERBRIDGE_FABRIC_BLOCK_ENTITY_LOADED
  - id: remove_block_entity
    action: send_command
    timeout: PT1M
    parameters:
      command: setblock 0 100 0 minecraft:air
  - id: block_entity_unloaded
    action: wait_for_log
    timeout: PT1M
    parameters:
      contains: LOADERBRIDGE_FABRIC_BLOCK_ENTITY_UNLOADED
  - id: force_fresh_chunk
    action: send_command
    timeout: PT1M
    parameters:
      command: forceload add 10000 10000
  - id: chunk_loaded
    action: wait_for_log
    timeout: PT3M
    parameters:
      contains: LOADERBRIDGE_FABRIC_CHUNK_LOADED
  - id: chunk_generated
    action: wait_for_log
    timeout: PT3M
    parameters:
      contains: LOADERBRIDGE_FABRIC_CHUNK_GENERATED
  - id: chunk_became_full
    action: wait_for_log
    timeout: PT1M
    parameters:
      contains: LOADERBRIDGE_FABRIC_CHUNK_LEVEL:INACCESSIBLE->FULL
  - id: release_fresh_chunk
    action: send_command
    timeout: PT1M
    parameters:
      command: forceload remove 10000 10000
  - id: chunk_unloaded
    action: wait_for_log
    timeout: PT3M
    parameters:
      contains: LOADERBRIDGE_FABRIC_CHUNK_UNLOADED
  - id: datapack_reload
    action: send_command
    timeout: PT1M
    parameters:
      command: reload
  - id: datapack_reload_started
    action: wait_for_log
    timeout: PT1M
    parameters:
      contains: LOADERBRIDGE_FABRIC_RELOAD_STARTED
  - id: datapack_reload_finished
    action: wait_for_log
    timeout: PT2M
    parameters:
      contains: LOADERBRIDGE_FABRIC_RELOAD_FINISHED
  - id: save
    action: save
    timeout: PT1M
    parameters:
      marker: All dimensions are saved
  - id: save_started
    action: wait_for_log
    timeout: PT1M
    parameters:
      contains: LOADERBRIDGE_FABRIC_SAVE_STARTED:true:true
  - id: save_finished
    action: wait_for_log
    timeout: PT1M
    parameters:
      contains: LOADERBRIDGE_FABRIC_SAVE_FINISHED:true:true
  - id: reload
    action: reload
    timeout: PT3M
    parameters:
      marker: LOADERBRIDGE_FABRIC_LIFECYCLE_TICKS_READY
  - id: tags_ready_after_reload
    action: wait_for_log
    timeout: PT1M
    parameters:
      contains: LOADERBRIDGE_FABRIC_LIFECYCLE_TAGS_READY
  - id: shutdown
    action: shutdown
    timeout: PT1M
    parameters:
      marker: All dimensions are saved
  - id: stopped
    action: wait_for_log
    timeout: PT1M
    parameters:
      contains: LOADERBRIDGE_FABRIC_SERVER_STOPPED
  - id: worlds_unloaded
    action: wait_for_log
    timeout: PT1M
    parameters:
      contains: LOADERBRIDGE_FABRIC_WORLDS_UNLOADED
