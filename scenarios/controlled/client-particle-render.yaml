schemaVersion: 1
id: client_particle_render
description: Verifies the controlled particle is spawned and rendered.
side: client
mods: [loaderbridge_test_probe]
steps:
  - {id: start, action: start_instance, timeout: PT3M}
  - {id: particle, action: assert_render, timeout: PT2M, parameters: {subject: "particle/loaderbridge:fixture", equals: "visible"}}
  - {id: stop, action: shutdown, timeout: PT1M, parameters: {marker: "LOADERBRIDGE_CLIENT_STOPPED"}}
