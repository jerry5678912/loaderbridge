schemaVersion: 1
id: server_registry_block
description: Verifies a controlled block is present in the server registry.
side: server
mods: [loaderbridge_test_probe]
steps:
  - {id: start, action: start_instance, timeout: PT2M}
  - {id: block, action: assert_registry, timeout: PT30S, parameters: {subject: "block/loaderbridge:fixture", equals: "registered"}}
  - {id: stop, action: shutdown, timeout: PT1M, parameters: {marker: "All dimensions are saved"}}
