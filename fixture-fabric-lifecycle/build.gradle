plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

minecraft {
    mappings channel: 'official', version: '1.21.1'
    reobf = false
}

repositories {
    exclusiveContent {
        forRepository {
            maven { url = 'https://libraries.minecraft.net/' }
        }
        filter {
            includeGroup 'org.lwjgl'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.0'
    compileOnly(project(':fabric-loader-shim')) {
        transitive = false
    }
    compileOnly(project(':fabric-api-base-bridge')) {
        transitive = false
    }
    compileOnly(project(':fabric-lifecycle-events-bridge')) {
        transitive = false
    }
    compileOnly(project(':fabric-resource-loader-v0-bridge')) {
        transitive = false
    }
    compileOnly(project(':fabric-game-rule-api-v1-bridge')) {
        transitive = false
    }
    compileOnly(project(':fabric-object-builder-api-v1-bridge')) {
        transitive = false
    }
    compileOnly(project(':fabric-api-lookup-api-v1-bridge')) {
        transitive = false
    }
    compileOnly(project(':fabric-registry-sync-v0-bridge')) {
        transitive = false
    }
    compileOnly(project(':fabric-networking-api-v1-bridge')) {
        transitive = false
    }
}

tasks.named('jar') {
    manifest {
        attributes('LICENSE': 'Apache-2.0')
    }
}
