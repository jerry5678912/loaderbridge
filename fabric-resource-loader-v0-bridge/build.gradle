plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

minecraft {
    mappings channel: 'official', version: '1.21.1'
    reobf = false
}

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://libraries.minecraft.net/' } }
        filter { includeGroup 'org.lwjgl' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.0'
    implementation project(':bridge-api')
    implementation(project(':fabric-api-base-bridge')) { transitive = false }
    implementation(project(':fabric-loader-shim')) { transitive = false }
}

tasks.named('jar') {
    manifest {
        attributes(
            'Automatic-Module-Name': 'dev.loaderbridge.fabric.api.resource',
            'LICENSE': 'Apache-2.0',
            'Implementation-Title': 'LoaderBridge Fabric Resource Loader Bridge',
            'Implementation-Version': '1.3.1+5b5275af19-loaderbridge.2'
        )
    }
}
