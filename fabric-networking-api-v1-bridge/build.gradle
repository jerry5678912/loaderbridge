plugins { id 'net.minecraftforge.gradle' version '6.0.54' }

minecraft { mappings channel: 'official', version: '1.21.1'; reobf = false }

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://libraries.minecraft.net/' } }
        filter { includeGroup 'org.lwjgl' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.0'
    implementation project(':bridge-api')
    implementation project(':fabric-api-base-bridge')
}

tasks.named('jar') {
    manifest {
        attributes('Automatic-Module-Name': 'dev.loaderbridge.fabric.api.networking',
                'LICENSE': 'Apache-2.0',
                'Implementation-Version': '4.3.1+d30f6a7919-loaderbridge.4',
                'MixinConfigs': 'loaderbridge.fabric-networking.mixins.json')
    }
}
