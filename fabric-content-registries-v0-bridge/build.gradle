plugins { id 'net.minecraftforge.gradle' version '6.0.54' }

minecraft { mappings channel: 'official', version: '1.21.1'; reobf = false }

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://libraries.minecraft.net/' } }
        filter { includeGroup 'org.lwjgl' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.0'
    implementation project(':bridge-api')
    implementation project(':fabric-api-base-bridge')
}

tasks.named('jar') {
    manifest {
        attributes('Automatic-Module-Name': 'dev.loaderbridge.fabric.content.registries.v0',
                'LICENSE': 'Apache-2.0',
                'Implementation-Title': 'LoaderBridge Fabric Content Registries v0 Bridge',
                'Implementation-Version': '8.0.19+b559734419-loaderbridge.1',
                'MixinConfigs': 'loaderbridge.fabric-content-registries.mixins.json')
    }
}
