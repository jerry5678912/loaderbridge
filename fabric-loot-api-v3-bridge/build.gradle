plugins { id 'net.minecraftforge.gradle' version '6.0.54' }

minecraft { mappings channel: 'official', version: '1.21.1'; reobf = false }

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://libraries.minecraft.net/' } }
        filter { includeGroup 'org.lwjgl' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.0'
    implementation project(':bridge-api')
    implementation(project(':fabric-loader-shim')) { transitive = false }
    implementation(project(':fabric-api-base-bridge')) { transitive = false }
    implementation(project(':fabric-resource-loader-v0-bridge')) { transitive = false }
}

tasks.named('jar') {
    manifest {
        attributes('Automatic-Module-Name': 'dev.loaderbridge.fabric.api.loot.v3',
                'LICENSE': 'Apache-2.0',
                'Implementation-Version': '1.0.3+3f89f5a519-loaderbridge.1',
                'MixinConfigs': 'loaderbridge.fabric-loot-api-v3.mixins.json')
    }
}
