plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = '1.0.0'
group = 'dev.loaderbridge'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def clientProbeOutput = layout.buildDirectory.dir('client-probe/main')

tasks.named('compileJava') {
    destinationDirectory = clientProbeOutput
}

sourceSets.main.output.classesDirs.setFrom(clientProbeOutput)

afterEvaluate {
    tasks.named('processResources') {
        destinationDir = clientProbeOutput.get().asFile
    }
    sourceSets.main.output.resourcesDir = clientProbeOutput.get().asFile
}

tasks.register('verifyClientProbeLayout') {
    dependsOn tasks.named('classes')
    inputs.dir(clientProbeOutput)
    doLast {
        def output = clientProbeOutput.get().asFile
        def metadata = new File(output, 'META-INF/mods.toml')
        def probeClass = new File(output, 'dev/loaderbridge/clientlab/ClientLabProbeMod.class')
        if (!metadata.isFile() || !probeClass.isFile()) {
            throw new GradleException("Client probe output must contain both mods.toml and ClientLabProbeMod.class: ${output}")
        }
    }
}

minecraft {
    mappings channel: 'official', version: '1.21.1'
    reobf = false
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                loaderbridge_client_probe {
                    source sourceSets.main
                }
            }
        }
    }
}

tasks.matching { it.name == 'runClient' }.configureEach {
    dependsOn tasks.named('verifyClientProbeLayout')
}

repositories {
    exclusiveContent {
        forRepository {
            maven { url = 'https://libraries.minecraft.net/' }
        }
        filter {
            includeGroup 'org.lwjgl'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.0'
}

dependencyLocking {
    lockAllConfigurations()
}
