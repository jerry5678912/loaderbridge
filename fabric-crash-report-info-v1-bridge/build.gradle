plugins { id 'net.minecraftforge.gradle' version '6.0.54' }

minecraft { mappings channel: 'official', version: '1.21.1'; reobf = false }

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://libraries.minecraft.net/' } }
        filter { includeGroup 'org.lwjgl' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.0'
    implementation project(':bridge-api')
    implementation(project(':fabric-loader-shim')) { transitive = false }
}

tasks.named('jar') {
    manifest {
        attributes('Automatic-Module-Name': 'dev.loaderbridge.fabric.crash.report.info.v1',
                'LICENSE': 'Apache-2.0',
                'Implementation-Title': 'LoaderBridge Fabric Crash Report Info v1 Bridge',
                'Implementation-Version': '0.2.29+0af3f5a719-loaderbridge.1',
                'MixinConfigs': 'loaderbridge.fabric-crash-report-info-v1.mixins.json')
    }
}
